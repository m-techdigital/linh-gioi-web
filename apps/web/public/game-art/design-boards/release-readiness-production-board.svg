<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">Cổng readiness phát hành</title>
  <desc id="desc">Bảng cổng owner trước kỳ vọng tester của Linh Giới Online</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#101827"/><stop offset="55%" stop-color="#172841"/><stop offset="100%" stop-color="#10271f"/></linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%"><feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#000000" flood-opacity="0.28"/></filter>
    <style>
      .title{font:800 44px Inter,Arial,sans-serif;fill:#f7fafc}.subtitle{font:500 20px Inter,Arial,sans-serif;fill:#c8d7e7}.label{font:700 20px Inter,Arial,sans-serif;fill:#f7fafc}.small{font:500 15px Inter,Arial,sans-serif;fill:#d8e2ed}.tiny{font:500 13px Inter,Arial,sans-serif;fill:#aebed0}.card{fill:#20324d;stroke:#4fd1c5;stroke-width:2;rx:24;filter:url(#shadow)}.card2{fill:#26344f;stroke:#f6ad55;stroke-width:2;rx:24;filter:url(#shadow)}.card3{fill:#1f3a32;stroke:#68d391;stroke-width:2;rx:24;filter:url(#shadow)}.muted{fill:#1a2539;stroke:#6b7280;stroke-width:1.5;rx:18}.line{stroke:#94a3b8;stroke-width:4;stroke-linecap:round}.dash{stroke:#f6ad55;stroke-width:4;stroke-linecap:round;stroke-dasharray:10 10}.accent{fill:#4fd1c5}.warn{fill:#f6ad55}.ok{fill:#68d391}.bad{fill:#f87171}
    </style>
  </defs>
  <rect width="1440" height="900" fill="url(#bg)"/>
  <text x="72" y="86" class="title">Cổng readiness phát hành</text>
  <text x="72" y="124" class="subtitle">Trước kỳ vọng test phải có bằng chứng owner và backend được duyệt</text>
  <rect x="90" y="185" width="190" height="510" class="muted"/><text x="120" y="235" class="label">Nội dung</text>
  <rect x="315" y="185" width="190" height="510" class="card2"/><text x="350" y="235" class="label">Build</text>
  <rect x="540" y="185" width="190" height="510" class="card"/><text x="570" y="235" class="label">Backend</text>
  <rect x="765" y="185" width="190" height="510" class="card2"/><text x="795" y="235" class="label">Bảo mật</text>
  <rect x="990" y="185" width="190" height="510" class="card"/><text x="1015" y="235" class="label">Hỗ trợ</text>
  <rect x="1215" y="185" width="145" height="510" class="card3"/><text x="1240" y="235" class="label">Duyệt</text>
  <rect x="115" y="285" width="140" height="88" class="card3"/><text x="132" y="325" class="small">Copy sẵn</text><text x="132" y="350" class="tiny">lore / gate</text>
  <rect x="340" y="285" width="140" height="88" class="card2"/><text x="358" y="325" class="small">Chưa tải</text><text x="358" y="350" class="tiny">no public build</text>
  <rect x="565" y="285" width="140" height="88" class="card2"/><text x="582" y="325" class="small">Bị chặn</text><text x="582" y="350" class="tiny">contract</text>
  <rect x="790" y="285" width="140" height="88" class="card2"/><text x="812" y="325" class="small">Đang duyệt</text><text x="812" y="350" class="tiny">anti-cheat</text>
  <rect x="1015" y="285" width="140" height="88" class="card"/><text x="1030" y="325" class="small">Chuẩn bị</text><text x="1030" y="350" class="tiny">support path</text>
  <rect x="1230" y="285" width="115" height="88" class="card3"/><text x="1250" y="325" class="small">Owner</text><text x="1250" y="350" class="tiny">sign-off</text>
  <path d="M255 330 H340 M480 330 H565 M705 330 H790 M930 330 H1015 M1155 330 H1230" class="dash"/>
  <text x="122" y="748" class="small">Không mở funnel giả · Không claim open beta · Không cấp entitlement khi NO_ACCEPTED_BACKEND_CONTRACT còn hiệu lực.</text>
  <text x="72" y="854" class="tiny">Linh Giới Online — ảnh tham chiếu UI cho page /release/readiness, không phải bằng chứng phát hành production.</text>
</svg>
