<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">Cổng M0 → M1</title>
  <desc id="desc">Hành trình từ sẵn sàng nội dung tới closed test có điều kiện</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#101827"/><stop offset="55%" stop-color="#172943"/><stop offset="100%" stop-color="#102820"/></linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%"><feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#000" flood-opacity="0.28"/></filter>
    <style>
      .title{font:800 46px Inter,Arial,sans-serif;fill:#f7fafc}.subtitle{font:500 22px Inter,Arial,sans-serif;fill:#c7d5e6}.label{font:800 22px Inter,Arial,sans-serif;fill:#f7fafc}.small{font:500 17px Inter,Arial,sans-serif;fill:#d8e2ed}.tiny{font:500 14px Inter,Arial,sans-serif;fill:#aebed0}.card{fill:#20324d;stroke:#4fd1c5;stroke-width:2;rx:24;filter:url(#shadow)}.card2{fill:#26344f;stroke:#f6ad55;stroke-width:2;rx:24;filter:url(#shadow)}.card3{fill:#1f3a32;stroke:#68d391;stroke-width:2;rx:24;filter:url(#shadow)}.dash{stroke:#f6ad55;stroke-width:4;stroke-linecap:round;stroke-dasharray:10 10}.ok{fill:#68d391}.warn{fill:#f6ad55}
    </style>
  </defs>
  <rect width="1440" height="900" fill="url(#bg)"/>
  <text x="72" y="86" class="title">M0 → M1</text>
  <text x="72" y="124" class="subtitle">Cổng giai đoạn: bằng chứng trước lời hứa</text>
  <rect x="86" y="190" width="380" height="470" class="card"/>
  <text x="124" y="245" class="label">M0 — Sẵn sàng nội dung</text>
  <text x="124" y="296" class="small">✓ Nội dung lõi hoàn tất</text>
  <text x="124" y="338" class="small">✓ Thế giới và hướng dẫn rõ</text>
  <text x="124" y="380" class="small">✓ Tin cậy tải game có gate</text>
  <text x="124" y="422" class="small">✓ Status và Support đồng bộ</text>
  <text x="124" y="486" class="small">Chưa claim tải công khai</text>
  <text x="124" y="528" class="small">Chưa claim open beta</text>
  <rect x="548" y="270" width="320" height="230" class="card2"/>
  <text x="612" y="342" class="label">Go / No-Go</text>
  <text x="592" y="386" class="small">Owner phê duyệt</text>
  <text x="592" y="426" class="small">hoặc giữ blocked state</text>
  <line x1="466" y1="425" x2="548" y2="385" class="dash"/>
  <line x1="868" y1="385" x2="960" y2="425" class="dash"/>
  <rect x="960" y="190" width="380" height="470" class="card3"/>
  <text x="998" y="245" class="label">M1 — Closed test</text>
  <text x="998" y="296" class="small">✓ Build ổn định</text>
  <text x="998" y="338" class="small">✓ Nhóm người chơi chọn lọc</text>
  <text x="998" y="380" class="small">✓ Feedback path an toàn</text>
  <text x="998" y="422" class="small">✓ Rollback và hỗ trợ rõ</text>
  <text x="998" y="486" class="small">Ít người hơn lúc đầu</text>
  <text x="998" y="528" class="small">Một thế giới tốt hơn sau này</text>
  <text x="72" y="854" class="tiny">Linh Giới Online — bảng tham chiếu phát hành, không phải claim production hoặc open beta.</text>
</svg>
